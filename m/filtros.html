<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Filtros móvil · Todoeléctrico · Diseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=block">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/bundle.css">
<link rel="stylesheet" href="../css/preview.css">
</head>
<body>
<div style="position: relative; width: 100%; height: 844px; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-text)">
  <div aria-hidden="true">
    <div style="height: 148px; background: var(--surface-inverse)"></div>
    <div style="padding: 16px; display: grid; gap: 12px">
      <div style="width: 60%; height: 28px; border-radius: 4px; background: var(--surface-sunken)"></div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px"><div style="height: 300px; border-radius: 8px; background: var(--surface-sunken)"></div><div style="height: 300px; border-radius: 8px; background: var(--surface-sunken)"></div></div>
    </div>
  </div>
  <div class="te-scrim"></div>

  <div class="te-drawer te-sheet" role="dialog" aria-modal="true" aria-labelledby="fm-title" style="position: absolute; top: 44px; left: 0; bottom: 0; width: 100%">
    <div class="te-sheet__grip" aria-hidden="true"></div>
    <div class="te-drawer__head" style="min-height: 52px">
      <p class="te-drawer__title" id="fm-title">Filtrar y ordenar</p>
      <button class="te-iconbtn" type="button" aria-label="Cerrar filtros"><span class="te-icon" aria-hidden="true">close</span></button>
    </div>

    <div class="te-drawer__body" style="padding-top: 12px">
      <div class="te-active" style="padding-bottom: 14px; border-bottom: 1px solid var(--line)">
        <button class="te-chip te-chip--active" type="button">R410A<span class="te-icon" aria-hidden="true">close</span></button>
        <button class="te-chip te-chip--active" type="button">Solo en stock<span class="te-icon" aria-hidden="true">close</span></button>
      </div>

      <div class="te-facets">
        <div class="te-facet" style="padding-top: 16px">
          <p class="te-facet__head" id="fm-sort">Ordenar por</p>
          <div class="te-facet__body te-facet__body--chips" role="radiogroup" aria-labelledby="fm-sort">
            <button class="te-chip te-chip--touch" type="button" role="radio" aria-checked="true" aria-pressed="true">Más vendidos</button>
            <button class="te-chip te-chip--touch" type="button" role="radio" aria-checked="false">Precio más bajo</button>
            <button class="te-chip te-chip--touch" type="button" role="radio" aria-checked="false">Precio más alto</button>
            <button class="te-chip te-chip--touch" type="button" role="radio" aria-checked="false">Mejor valorados</button>
          </div>
        </div>
        <div class="te-facet">
          <button class="te-facet__head" type="button" aria-expanded="true">Sustituye a<span class="te-icon" aria-hidden="true">expand_less</span></button>
          <p style="margin-top: 4px; font-size: 13px; line-height: 18px; color: var(--ink-muted)">El gas que indica la etiqueta de tu equipo</p>
          <div class="te-facet__body te-facet__body--chips">
            <button class="te-chip te-chip--touch" type="button" aria-pressed="true">R410A <span class="te-chip__count">35</span></button>
            <button class="te-chip te-chip--touch" type="button" aria-pressed="false">R32 <span class="te-chip__count">31</span></button>
            <button class="te-chip te-chip--touch" type="button" aria-pressed="false">R22 <span class="te-chip__count">25</span></button>
            <button class="te-chip te-chip--touch" type="button" aria-pressed="false">R407C <span class="te-chip__count">25</span></button>
            <button class="te-chip te-chip--touch" type="button" aria-pressed="false">R134a <span class="te-chip__count">57</span></button>
            <button class="te-chip te-chip--touch" type="button" aria-pressed="false">R1234yf <span class="te-chip__count">27</span></button>
            <button class="te-chip te-chip--touch" type="button" aria-pressed="false">R12 <span class="te-chip__count">28</span></button>
            <button class="te-chip te-chip--touch" type="button" aria-pressed="false">R290 <span class="te-chip__count">9</span></button>
          </div>
        </div>
        <div class="te-facet">
          <button class="te-facet__head" type="button" aria-expanded="false">Incluye<span style="display: inline-flex; align-items: center; gap: 6px; font: 400 14px/20px var(--font-text); color: var(--ink-muted)">Todos<span class="te-icon" aria-hidden="true">expand_more</span></span></button>
        </div>
        <div class="te-facet">
          <button class="te-facet__head" type="button" aria-expanded="false">Marca<span style="display: inline-flex; align-items: center; gap: 6px; font: 400 14px/20px var(--font-text); color: var(--ink-muted)">Todas<span class="te-icon" aria-hidden="true">expand_more</span></span></button>
        </div>
        <div class="te-facet">
          <button class="te-facet__head" type="button" aria-expanded="false">Precio<span style="display: inline-flex; align-items: center; gap: 6px; font: 400 14px/20px var(--font-text); color: var(--ink-muted)">5 € – 183 €<span class="te-icon" aria-hidden="true">expand_more</span></span></button>
        </div>
        <div class="te-facet" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
          <label class="te-switch" for="fm-stock" style="font: 600 17px/22px var(--font-display)">Solo en stock</label>
          <span class="te-switch"><input id="fm-stock" type="checkbox" checked aria-label="Solo en stock"></span>
        </div>
      </div>
    </div>

    <div class="te-drawer__foot" style="display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px">
      <button class="te-btn te-btn--secondary te-btn--lg" type="button">Borrar todo</button>
      <a class="te-btn te-btn--primary te-btn--lg" href="categoria.html">Ver 35 productos</a>
    </div>
  </div>
</div>

</body>
</html>
