<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Versión móvil · Todoeléctrico · Diseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=block">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/bundle.css">
<link rel="stylesheet" href="css/preview.css">
</head>
<body class="pv-viewer">
<div class="pv-v">
  <aside class="pv-v__side">
    <a class="pv-back" href="index.html"><span class="te-icon" aria-hidden="true">arrow_back</span>Todas las pantallas</a>
    <h1>Versión móvil</h1>
    <nav class="pv-v__nav" aria-label="Pantallas en móvil"><a href="#inicio" data-p="inicio">Inicio</a><a href="#menu" data-p="menu">Menú</a><a href="#buscador" data-p="buscador">Buscador</a><a href="#categoria" data-p="categoria">Categoría</a><a href="#filtros" data-p="filtros">Filtros</a><a href="#producto" data-p="producto">Producto · gas</a><a href="#producto-cable" data-p="producto-cable">Producto · cable por metros</a><a href="#carrito" data-p="carrito">Carrito</a><a href="#checkout" data-p="checkout">Compra</a></nav>
    <a class="te-btn te-btn--secondary te-btn--sm" id="pv-open" href="m/inicio.html" target="_blank" rel="noopener" style="align-self: flex-start"><span class="te-icon" aria-hidden="true">open_in_new</span>Abrir a pantalla completa</a>
    <p class="pv-tip">Haz clic dentro del móvil como en la tienda. Desde un teléfono, esta página abre el diseño a pantalla completa.</p>
  </aside>
  <div class="pv-v__stage" id="pv-stage"><div class="pv-phone" id="pv-phone"><iframe id="pv-frame" title="Diseño en móvil" src="m/inicio.html"></iframe></div></div>
</div>
<script>
(function () {
  var pages = ["inicio","menu","buscador","categoria","filtros","producto","producto-cable","carrito","checkout"];
  var frame = document.getElementById('pv-frame');
  var phone = document.getElementById('pv-phone');
  var stage = document.getElementById('pv-stage');
  var open = document.getElementById('pv-open');
  function current() { var h = location.hash.slice(1); return pages.indexOf(h) >= 0 ? h : 'inicio'; }
  if (window.matchMedia('(max-width: 600px)').matches) { location.replace('m/' + current() + '.html'); return; }
  function mark(p) {
    var links = document.querySelectorAll('[data-p]');
    for (var i = 0; i < links.length; i++) { links[i].setAttribute('aria-current', links[i].getAttribute('data-p') === p ? 'page' : 'false'); }
    open.href = 'm/' + p + '.html';
  }
  function show(p) { frame.src = 'm/' + p + '.html'; mark(p); }
  function fit() {
    var s = Math.min(1, (window.innerHeight - 48) / 868);
    phone.style.transform = 'scale(' + s + ')';
    stage.style.height = Math.ceil(868 * s + 48) + 'px';
  }
  window.addEventListener('hashchange', function () { show(current()); });
  window.addEventListener('resize', fit);
  frame.addEventListener('load', function () {
    try {
      var m = frame.contentWindow.location.pathname.match(/\/m\/([a-z-]+)\.html$/);
      if (m && pages.indexOf(m[1]) >= 0 && m[1] !== current()) { history.replaceState(null, '', '#' + m[1]); mark(m[1]); }
    } catch (e) {}
  });
  fit();
  show(current());
})();
</script>

</body>
</html>
